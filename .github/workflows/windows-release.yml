name: Windows

# Gera o instalador do Windows. Em tags v*, publica uma release com ele anexado.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            python:p python-gobject:p python-cairo:p gtk4:p libadwaita:p
            adwaita-icon-theme:p librsvg:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p
            gst-plugins-ugly:p gst-libav:p
            pyinstaller:p imagemagick:p

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import screen_toolbox; print(screen_toolbox.VERSION)')"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com VERSION=$version em screen_toolbox/__init__.py" >&2
            exit 1
          fi

      - name: Build (PyInstaller)
        run: bash packaging/windows/build.sh

      - name: Autoteste do pacote
        run: |
          status=0
          ./build/windows/dist/screen-toolbox/screen-toolbox.exe --self-test build/windows/self-test.txt || status=$?
          cat build/windows/self-test.txt
          exit $status

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Get-Content build\windows\VERSION).Trim()
          & $iscc "/DAppVersion=$version" packaging\windows\screen-toolbox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: screen-toolbox-windows
          path: |
            build/windows/ScreenToolbox-*-setup.exe
            build/windows/self-test.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/ScreenToolbox-*-setup.exe
          generate_release_notes: true
